name: Deploy Supabase Edge Functions

# Deploys supabase/functions and sets their secrets from GitHub secrets.
# Required GitHub secrets:
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF    project ref (the "abcdefgh" in https://abcdefgh.supabase.co)
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT (e.g. mailto:you@example.com)
#   PUSH_WEBHOOK_SECRET     same value as the Vault secret "push_webhook_secret"
# The job is skipped while SUPABASE_ACCESS_TOKEN is not set.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF fehlen – Edge Functions werden nicht deployt."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest

      - name: Set function secrets
        if: steps.check.outputs.skip != 'true'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
        run: |
          for name in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT PUSH_WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::GitHub-Secret $name fehlt."; exit 1; fi
          done
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="$VAPID_SUBJECT" \
            PUSH_WEBHOOK_SECRET="$PUSH_WEBHOOK_SECRET"

      - name: Deploy send-push
        if: steps.check.outputs.skip != 'true'
        run: supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
