<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a237e" />
    <!-- Replaced with the project <Version> during the GitHub Pages build. -->
    <meta name="app-version" content="dev" />
    <title>BlockerBetting</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/design.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <script type="importmap"></script>
    <script>window.bb = { prefersDark: function () { return window.matchMedia('(prefers-color-scheme: dark)').matches; } };</script>
</head>

<body>
    <div id="app">
        <div class="splash">
            <div class="splash-glow"></div>
            <div class="splash-content">
                <img class="splash-logo" src="favicon.svg" alt="" width="112" height="112" />
                <h1 class="splash-title">BlockerBetting</h1>
                <p class="splash-subtitle">Interne Wettplattform</p>
                <div class="splash-progress" role="progressbar" aria-label="App wird geladen">
                    <div class="splash-progress-bar"></div>
                </div>
                <div class="splash-percent"></div>
            </div>
            <footer class="splash-footer">
                <span class="app-version">v–</span> · by Lucas Nagelsmann
            </footer>
        </div>
    </div>

    <div id="blazor-error-ui">
        Es ist ein Fehler aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        (function () {
            var v = document.querySelector('meta[name="app-version"]').content;
            document.querySelectorAll('.app-version').forEach(function (el) { el.textContent = v === 'dev' ? 'dev' : 'v' + v; });
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/push.js"></script>
    <script>
        (function () {
            if (!('serviceWorker' in navigator)) return;
            // When a new version takes over an already controlled page, reload once so the
            // page runs the new app files instead of the previously cached ones.
            var hadController = !!navigator.serviceWorker.controller;
            var reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!hadController || reloading) return;
                reloading = true;
                window.location.reload();
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(function (reg) {
                // Check for updates whenever the app comes back to the foreground (e.g. installed PWA).
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'visible') reg.update();
                });
            });
        })();
    </script>
</body>

</html>
